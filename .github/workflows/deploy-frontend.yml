name: Deploy Frontend to Azure

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy
          cp -r frontend/build deploy/build
          cp frontend/package.json deploy/
          cp frontend/package-lock.json deploy/
          cd deploy && npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: flowquote-itvalley
          publish-profile: ${{ secrets.AZURE_FLOWQUOTE_WEB_PUBLISH_PROFILE }}
          package: deploy
